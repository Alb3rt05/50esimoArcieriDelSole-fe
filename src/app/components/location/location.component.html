<section class="container mt-2 mb-2 relative-container">
    <div class="text-center mb-2">
        <h2 class="text-solar creative-title">LOCATION</h2>

    </div>

    <div class="location-creative-layout">
        <!-- The Map stylized as a physical object -->
        <div class="map-polaroid">
            <div class="pin">📍</div>
            <div class="map-frame">
                <iframe title="Mappa Tensostruttura Solaro"
                    src="https://www.google.com/maps/d/u/0/embed?mid=1Tw_LhWoTJdXnNCnSB5ipaQhxjCUYgSY&ehbc=2E312F"
                    width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
            <div class="caption hand-font">Presso il centro anziani Maps in Via Drizza 20, Solaro (MI)
            </div>
        </div>

        <!-- Info Cards stylized as pinned notes -->
        <div class="notes-container">
            <div class="note-card note-yellow">
                <div class="tape"></div>
                <h3 class="hand-font">
                    <img class="icon" src="assets/icons/park.svg" alt="Parcheggi">
                    Parcheggi
                </h3>
                <p class="sub-note">Non preoccuparti per l'auto! Abbiamo tantissimi parcheggi disponibili in mappa!</p>
            </div>

            <div class="note-card note-white">
                <div class="tape"></div>
                <h3 class="hand-font">
                    <img class="icon" src="assets/icons/archery.svg" alt="Tensostruttura">
                    Tensostruttura
                </h3>
                <p class="sub-note">Nella Tensostruttura troverai il campo gara!</p>
            </div>

            <div class="note-card note-blue">
                <div class="tape"></div>
                <h3 class="hand-font">
                    <img class="icon" src="assets/icons/bar.svg" alt="Sala Rinfresco">
                    Sala Rinfresco
                </h3>
                <p class="sub-note">Un buffet con tante sfiziosità e bollicine</p>
            </div>
        </div>
    </div>
</section>
